# Render.com Infrastructure as Code Deployment Configuration
services:
  - type: web
    name: lead-generation-engine
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /login.html
    envVars:
      - key: ADMIN_USERNAME
        value: ****
      - key: ADMIN_PASSWORD
        value: ****
      - key: PORT
        value: 8000
